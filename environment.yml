# zp3-glioma — reproducible analysis environment
# Conda environment file. Create & activate:
#   conda env create -f environment.yml
#   conda activate zp3-glioma
# Pinned versions mirror requirements.txt (verified against managed Python 3.13).
name: zp3-glioma
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.1.3
      - pandas==2.2.3
      - scipy==1.14.1
      - lifelines==0.30.3
      - scanpy==1.12.3
      - anndata==0.12.0
      - matplotlib==3.9.2
      - seaborn==0.13.2
      - requests==2.32.3
